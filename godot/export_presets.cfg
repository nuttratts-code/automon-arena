; Set 192 (plan P1 step 3). HARD RULE 9 ④: exports carry only the game — tests/, tools/,
; docs (*.md) and golden fixtures are excluded. Release builds add PCK encryption at P6
; (custom templates, key from env / Actions secret, never in this file).
[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/fonts/*.ttf, data/fonts/*.txt"
exclude_filter="tests/*, tools/*, *.md, addons/godot_mcp_toolkit/*, addons/.godot_mcp_toolkit_update/*, addons/.godot_mcp_toolkit_recovery/*, .mcp.json"
export_path="../build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
