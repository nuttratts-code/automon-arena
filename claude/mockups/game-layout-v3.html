<title>Automon Arena Layout Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Landscape-first, full width, one screen. HUD on top (stats + tribe/rune icon buttons + difficulty) · field: my 3x2 only while shopping, my 3x2 | enemy 3x2 while fighting · bench under it · large shop strip + fight button along the bottom. */
:root {
  --bg: #efe9df; --panel: #fbf8f3; --ink: #231f1a; --mute: #6b6258; --line: #d8cfc2; --soft: #f1ebe1;
  --arena: #e3d6c1; --arena-line: #c9b89c; --foe-zone: #dccab0; --accent: #2d5f7c; --on-accent: #ffffff;
  --gold: #9a6b00; --gold-bg: #f7e7bf; --heart: #b3263a; --hp: #3c9a5f; --hp-bg: #d9cfbf; --bad: #b3261e;
  --t-steel: #6e7d8c; --t-fire: #d9542b; --t-bolt: #d6a11a; --t-wind: #2f9c7b; --t-spirit: #7d62c6; --t-fiend: #a92f48;
  --shade: rgba(35,31,26,.45);
  --f-display: "Mitr", "IBM Plex Sans Thai", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", Tahoma, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17140f; --panel: #211d17; --ink: #efe8dc; --mute: #a89e90; --line: #3a332a; --soft: #2a251d;
  --arena: #2b251c; --arena-line: #4a3f30; --foe-zone: #251f17; --accent: #8cc0de; --on-accent: #10202a;
  --gold: #f0c860; --gold-bg: #3a2f14; --heart: #f07a8c; --hp: #5cc283; --hp-bg: #3a332a; --bad: #ff8f86;
  --t-steel: #97a6b5; --t-fire: #f0764b; --t-bolt: #f0c445; --t-wind: #4cc49e; --t-spirit: #a48ce8; --t-fiend: #e0566f;
  --shade: rgba(0,0,0,.6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #17140f; --panel: #211d17; --ink: #efe8dc; --mute: #a89e90; --line: #3a332a; --soft: #2a251d;
  --arena: #2b251c; --arena-line: #4a3f30; --foe-zone: #251f17; --accent: #8cc0de; --on-accent: #10202a;
  --gold: #f0c860; --gold-bg: #3a2f14; --heart: #f07a8c; --hp: #5cc283; --hp-bg: #3a332a; --bad: #ff8f86;
  --t-steel: #97a6b5; --t-fire: #f0764b; --t-bolt: #f0c445; --t-wind: #4cc49e; --t-spirit: #a48ce8; --t-fiend: #e0566f;
  --shade: rgba(0,0,0,.6); color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.35; overflow: hidden; }
* { box-sizing: border-box; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: 600 .85rem var(--f-body); border-radius: 8px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: .72rem; color: var(--mute); margin: 0; }
.lbl { font: 600 .7rem var(--f-display); color: var(--mute); letter-spacing: .02em; }
.grow { flex: 1; min-width: 0; }

/* HUD */
.hud { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.hud h1 { font: 600 1rem var(--f-display); margin: 0 8px 0 0; }
.stat { font: 500 .8rem var(--f-mono); font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
.stat.gold { color: var(--gold); background: var(--gold-bg); border-color: transparent; font-weight: 600; }
.stat.heart { color: var(--heart); }
.tag { font: 600 .64rem var(--f-body); color: var(--accent); border: 1px dashed var(--accent); border-radius: 99px; padding: 1px 8px; }
.seg { display: flex; gap: 3px; }
.seg button { padding: 4px 10px; font-size: .78rem; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.seg.mono button { font-family: var(--f-mono); padding: 4px 8px; }

/* icons: coloured shapes (placeholder art) */
.ico { width: var(--s, 30px); height: var(--s, 30px); flex: none; background: var(--c); }
.ico.tri { clip-path: polygon(50% 4%, 96% 92%, 4% 92%); }
.ico.sq { border-radius: 18%; }
.ico.dia { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.ico.circ { border-radius: 50%; }
.ico.hex { clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); }
.ico.pent { clip-path: polygon(50% 0, 98% 36%, 80% 96%, 20% 96%, 2% 36%); }

/* middle: field */
.mid { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.hudbtn { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; }
.hudbtn svg { width: 22px; height: 22px; }
.hudbtn .badge { font: 600 .72rem var(--f-mono); background: var(--accent); color: var(--on-accent); border-radius: 99px; padding: 0 6px; }
.hudbtn .mini { display: flex; gap: 2px; }
.hudbtn .mini .ico { --s: 14px; }
.list { display: grid; gap: 6px; }
.list .tribe, .list .rune { width: 100%; }
.rune { grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; }
.rune svg { width: 22px; height: 22px; grid-row: 1 / 3; color: var(--gold); }
.tribe { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); text-align: left; font-weight: 600; }
.tribe .ico { --s: 20px; }
.tribe { padding: 8px 10px; }
.tribe small { font: 500 .72rem var(--f-mono); color: var(--mute); }
.tribe .pips { display: flex; gap: 2px; }
.tribe .pips i { width: 6px; height: 12px; border-radius: 2px; background: var(--line); }
.tribe .pips i.on { background: var(--c); }
.tribe.off { opacity: .55; }
.rune { padding: 7px 10px; text-align: left; background: var(--soft); display: grid; gap: 0; }
.rune b { font-size: .85rem; }
.rune span { font-size: .7rem; color: var(--mute); font-weight: 400; }

.field { position: relative; background: var(--arena); border: 1px solid var(--arena-line); border-radius: 12px; padding: 8px 10px 10px;
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 18px; row-gap: 6px; min-height: 0; }
.field .foe, .field .side-head.foehead { display: none; }
.fighting .field { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "h1 h2" "t1 t2" "b b"; }
.fighting .field .foe, .fighting .field .side-head.foehead { display: grid; }
.field::before { display: none; }
.fighting .field::before { display: block; content: ""; position: absolute; top: 10px; bottom: 10px; left: 50%; border-left: 2px dashed var(--arena-line); }
.side-head { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.side-head .lbl:first-child { text-align: left; }
.team { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0; }
.cell { border: 1px dashed var(--arena-line); border-radius: 10px; display: grid; min-height: 0; min-width: 0; position: relative; }
.team.foe .cell { background: var(--foe-zone); border-style: solid; border-color: transparent; }
.foe-q { display: grid; place-items: center; font: 600 1.6rem var(--f-display); color: var(--arena-line); }
.bench { grid-column: 1 / -1; display: grid; grid-template-columns: auto repeat(8, minmax(0, 1fr)); gap: 6px; align-items: stretch; border-top: 1px solid var(--arena-line); padding-top: 8px; }
.bench .lbl { align-self: center; writing-mode: vertical-rl; transform: rotate(180deg); }
.bench .cell { background: color-mix(in srgb, var(--panel) 45%, transparent); height: clamp(42px, 8vh, 70px); }
.cell.over { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.unit { display: grid; justify-items: center; align-content: center; gap: 2px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; padding: 4px; border-radius: 10px; min-height: 0; overflow: hidden; }
.team .unit { --s: clamp(28px, 7vh, 56px); background: color-mix(in srgb, var(--panel) 50%, transparent); }
.bench .unit { --s: clamp(18px, 3.4vh, 28px); gap: 0; padding: 2px; }
.unit .nm { font-size: .74rem; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bench .unit .nm { font-size: .64rem; }
.lv { font: 600 .62rem var(--f-mono); color: var(--gold); line-height: 1; }
.unit.merge { animation: pop .5s ease; box-shadow: 0 0 0 2px var(--gold); }
@keyframes pop { 40% { transform: scale(1.1); } }

/* battle on the same field */
.bar { width: 80%; height: 6px; background: var(--hp-bg); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--hp); transition: width .15s linear; }
.unit.dead { opacity: .28; }
.unit.hit { animation: shake .25s; }
@keyframes shake { 30% { transform: translateX(-3px); } 70% { transform: translateX(3px); } }
.float { position: absolute; top: 4px; left: 50%; font: 600 .8rem var(--f-mono); color: var(--bad); pointer-events: none; animation: rise .7s forwards; }
@keyframes rise { to { transform: translate(-50%, -18px); opacity: 0; } }
.fighting .bench { opacity: .35; pointer-events: none; }
.result { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--arena) 65%, transparent); border-radius: 12px; z-index: 2; }
.result > div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 22px; display: grid; gap: 10px; justify-items: center; text-align: center; box-shadow: 0 8px 30px var(--shade); }
.result strong { font: 600 1.5rem var(--f-display); }
.result .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.replaytag { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font: 600 .7rem var(--f-body); background: var(--accent); color: var(--on-accent); padding: 2px 10px; border-radius: 99px; z-index: 1; }

/* bottom strip: shop or battle controls */
.dock { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: stretch; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
.dock .left, .dock .right { display: flex; flex-direction: column; justify-content: center; gap: 5px; }
.dock .left button { white-space: nowrap; }
.shop { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.dock { min-height: clamp(70px, 20vh, 150px); }
.card { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: 12px; row-gap: 2px; align-items: center; padding: clamp(8px, 2vh, 16px) 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; min-width: 0; }
.card .ico { --s: clamp(32px, 9vh, 64px); grid-row: 1 / 4; }
.card .nm { font-weight: 600; font-size: clamp(.8rem, 2vh, 1rem); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .rar { font-size: .7rem; color: var(--mute); }
.card .sub { font: 500 .74rem var(--f-mono); color: var(--mute); display: flex; justify-content: space-between; gap: 4px; }
.card .price { color: var(--gold); font-weight: 600; }
.card.cant .price { color: var(--bad); }
.card.locked { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.card.locked::after { content: "ล็อก"; position: absolute; top: -7px; right: 8px; font: 600 .58rem var(--f-body); background: var(--gold); color: var(--panel); border-radius: 5px; padding: 0 4px; }
.card.sold { visibility: hidden; }
.dock.sellzone.over { outline: 2px dashed var(--bad); outline-offset: -4px; }
#fight { font-size: 1.1rem; padding: 12px 30px; height: 100%; }
.dock .left button { height: 100%; }
.bctl { display: none; align-items: center; gap: 10px; min-width: 0; }
.ticker { font-size: .78rem; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fighting .shop, .fighting #reroll, .fighting .shopnote, .fighting #fight { display: none; }
.fighting .bctl { display: flex; }

/* popup */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--ink); width: min(460px, calc(100vw - 32px)); max-height: calc(100% - 32px); box-shadow: 0 12px 40px var(--shade); }
dialog::backdrop { background: var(--shade); }
.pop { padding: 14px; display: grid; gap: 10px; }
.pop header { display: flex; gap: 10px; align-items: center; }
.pop header .ico { --s: 40px; }
.pop h3 { font: 600 1rem var(--f-display); margin: 0; }
.pop p { margin: 0; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.statgrid div { background: var(--soft); border-radius: 8px; padding: 6px 8px; display: grid; }
.statgrid span { font-size: .68rem; color: var(--mute); }
.statgrid b { font: 600 .95rem var(--f-mono); font-variant-numeric: tabular-nums; }
.skill { border-left: 3px solid var(--c, var(--accent)); padding: 2px 0 2px 8px; }
.skill b { font-size: .82rem; }
.skill p { margin: 1px 0 0; font-size: .78rem; color: var(--mute); }
.acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mxt { width: 100%; border-collapse: collapse; font-size: .78rem; }
.mxt td, .mxt th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.mxt td:last-child, .mxt th:last-child { text-align: right; font-family: var(--f-mono); }
.dmgbar { height: 5px; background: var(--c); border-radius: 3px; margin-top: 2px; }
.scroll { overflow: auto; }

#ghost { position: fixed; pointer-events: none; z-index: 50; transform: translate(-50%, -60%); opacity: .9; }
#toast { position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 14px; border-radius: 99px; font-size: .8rem; z-index: 60; }
#rotate { display: none; }

/* short landscape screens (phone held sideways) */
@media (max-height: 520px) {
  .app { gap: 5px; padding-block: 4px; }
  .hud h1, .tag { display: none; }
  .stat { padding: 1px 7px; font-size: .72rem; }
  .seg button { padding: 2px 7px; }
  .field { padding: 5px 8px 6px; row-gap: 4px; }
  .team { gap: 5px; }
  .unit .nm { font-size: .64rem; }
  .bench { padding-top: 5px; gap: 4px; }
  .dock { padding: 5px; gap: 6px; }
  .card { padding: 4px 6px; column-gap: 5px; }
  .card .nm { font-size: .72rem; }
  .shopnote { display: none; }
  #fight { padding: 8px 16px; font-size: .9rem; }
  .hudbtn { padding: 2px 8px; }
  .hudbtn svg { width: 18px; height: 18px; }
  .card .rar, .card .sub span:first-child { display: none; }
  .card .sub { justify-content: flex-start; }
  .unit { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 6px; }
  .team .unit { --s: 24px; }
  .bench .unit .nm { display: none; }
}
/* portrait phone: ask to rotate */
@media (orientation: portrait) and (max-width: 700px) {
  #rotate:not(.dismissed) { display: grid; position: fixed; inset: 0; z-index: 70; background: var(--bg); place-items: center; text-align: center; padding: 24px; }
  #rotate > div { display: grid; gap: 12px; justify-items: center; max-width: 280px; }
  #rotate .phone { width: 46px; height: 80px; border: 3px solid var(--ink); border-radius: 10px; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 40%, 100% { transform: rotate(-90deg); } }
  .card { grid-template-columns: 1fr; justify-items: center; padding: 4px; }
  .card .ico { grid-row: auto; }
  .card .sub span:first-child, .shopnote { display: none; }
  .dock { grid-template-columns: 1fr auto; }
  .dock .left { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <div class="hud">
    <h1>Automon Arena</h1>
    <span class="stat" id="sRound">รอบ 3</span>
    <span class="stat heart">หัวใจ 9</span>
    <span class="stat" id="sWins">ชนะ 2/10</span>
    <span class="stat gold" id="sGold">เงิน 10</span>
    <button class="hudbtn" id="tribeBtn" type="button" aria-label="เผ่าในทีม"><span class="mini" id="tribeMini"></span><span class="badge" id="tribeCnt">0</span></button>
    <button class="hudbtn" id="runeBtn" type="button" aria-label="รูนของฉัน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8 8V6a4 4 0 0 1 8 0v2"/><path d="M4.5 8h15l-1.2 12.2a1 1 0 0 1-1 .8H6.7a1 1 0 0 1-1-.8z"/><path d="M9 13h6"/></svg><span class="badge" id="runeCnt">3</span></button>
    <span class="tag">ตัวอย่างหน้าตา · ยังไม่ใช่เกมจริง</span>
    <span class="grow"></span>
    <span class="lbl">ความยาก</span>
    <div class="seg" id="diff"><button type="button" data-d="ง่าย" aria-pressed="false">ง่าย</button><button type="button" data-d="กลาง" aria-pressed="true">กลาง</button><button type="button" data-d="ยาก" aria-pressed="false">ยาก</button></div>
    <button id="diffInfo" type="button" aria-label="ความยากคืออะไร">?</button>
  </div>

  <div class="mid">
    <div class="field" id="field">
      <div class="side-head"><span class="lbl" style="text-align:center">ทีมคุณ · หลัง</span><span class="lbl">กลาง</span><span class="lbl">หน้า →</span></div>
      <div class="side-head foehead"><span class="lbl" style="text-align:center">← หน้า</span><span class="lbl">กลาง</span><span class="lbl">หลัง · คู่แข่ง</span></div>
      <div class="team" id="mine"></div>
      <div class="team foe" id="foe"></div>
      <div class="bench" id="bench"></div>
      <span class="replaytag" id="replayTag" hidden>กำลังดูรีเพลย์</span>
      <div class="result" id="result" hidden><div>
        <strong id="resTitle"></strong><span class="hint" id="resSub"></span>
        <div class="row">
          <button id="replay" type="button">▶ ดูรีเพลย์</button>
          <button id="details" type="button">รายละเอียดแมตช์</button>
          <button class="primary" id="next" type="button">ไปรอบถัดไป</button>
        </div>
      </div></div>
    </div>
  </div>

  <div class="dock sellzone" id="dock" data-drop="sell">
    <div class="left">
      <button id="reroll" type="button">รีโรล −2</button>
      <span class="hint shopnote">ร้าน Lv 3</span>
    </div>
    <div style="display:grid;gap:4px;min-width:0">
      <div class="shop" id="shop"></div>
      <div class="bctl">
        <span class="stat" id="clock">0.0 วิ</span>
        <div class="seg mono" id="speed"><button type="button" data-s="1" aria-pressed="false">1×</button><button type="button" data-s="2" aria-pressed="true">2×</button><button type="button" data-s="4" aria-pressed="false">4×</button><button type="button" data-s="8" aria-pressed="false">8×</button></div>
        <button id="skip" type="button">ข้ามไปผล</button>
        <span class="ticker grow" id="ticker">แตะตัวไหนก็ได้ในสนามเพื่อดูค่าแบบเรียลไทม์</span>
      </div>
    </div>
    <div class="right">
      <button class="primary" id="fight" type="button">เริ่มสู้</button>
    </div>
  </div>
</div>

<div id="rotate"><div><div class="phone"></div><strong>หมุนมือถือเป็นแนวนอน</strong><span class="hint">เกมนี้ออกแบบให้เล่นแนวนอนเป็นหลัก</span><button id="rotateSkip" type="button">ใช้แนวตั้งต่อ</button></div></div>
<dialog id="dlg"><div class="pop" id="pop"></div></dialog>
<div id="ghost" hidden></div>
<div id="toast" hidden></div>

<script>
(() => {
  const TR = {
    fire: { n: 'ไฟ', s: 'tri', c: '--t-fire' }, steel: { n: 'เหล็ก', s: 'sq', c: '--t-steel' }, bolt: { n: 'สายฟ้า', s: 'dia', c: '--t-bolt' },
    wind: { n: 'วายุ', s: 'circ', c: '--t-wind' }, spirit: { n: 'ภูติ', s: 'hex', c: '--t-spirit' }, fiend: { n: 'อสูร', s: 'pent', c: '--t-fiend' } };
  const DEF = {

  };
  render();
})();
</script>
