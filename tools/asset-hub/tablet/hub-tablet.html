<title>Automon Pixel Tablet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap">
<style>
/* Workbench layout: list of creatures → full-height editor (stage left, tool rail right; stacks under 900px). One dark look by choice, matching the asset hub. */
:root {
  --bg: #1b1f26; --panel: #232832; --panel2: #2b313c; --line: #3a4250;
  --text: #e6e9ef; --dim: #9aa3b2; --accent: #f0a63a; --ok: #3fb56b; --bad: #e05050;
  --chk1: #3a404b; --chk2: #2f343e;
  --steel: #9aa9ba; --fire: #e0793c; --storm: #d8c040; --wind: #7cc9a6; --spirit: #93b4ee; --demon: #c4587a;
  --f-ui: "IBM Plex Sans Thai", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
input { -webkit-user-select: text; user-select: text; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--f-ui); overflow: hidden; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-height: 44px; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.on { background: var(--accent); border-color: var(--accent); color: #1b1f26; font-weight: 700; }
button.primary { background: var(--ok); border-color: var(--ok); color: #0f1a12; font-weight: 700; }
button:disabled { opacity: .45; cursor: default; }
.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 17px; margin: 0; font-weight: 700; }
.bar .sp { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.dim { color: var(--dim); }
.mono { font-family: var(--f-mono); }
/* list */
.list { flex: 1; overflow-y: auto; padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chips button { min-height: 36px; padding: 4px 12px; border-color: var(--c, var(--line)); }
.chips button.on { background: var(--c); border-color: var(--c); }
.tribe { margin: 18px 0 8px; font-size: 14px; font-weight: 700; color: var(--c); letter-spacing: .02em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: stretch; gap: 6px; padding: 8px; text-align: left; border-left: 3px solid var(--c, var(--line)); position: relative; }
.tile .pic { aspect-ratio: 1; display: grid; place-items: center; border-radius: 6px; background: repeating-conic-gradient(var(--chk1) 0 25%, var(--chk2) 0 50%) 0 0 / 16px 16px; }
.tile img { width: 85%; height: 85%; object-fit: contain; image-rendering: pixelated; }
.tile .nm { font-size: 13px; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.tile .badge { position: absolute; top: 6px; right: 6px; background: var(--accent); color: #1b1f26; font-size: 12px; font-weight: 700; border-radius: 99px; padding: 1px 8px; }
.note { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; max-width: 70ch; }
.note.bad { border-color: var(--bad); }
/* editor */
.ed { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 320px; }
.stage { position: relative; min-width: 0; min-height: 0; touch-action: none; background: var(--bg); overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.side { overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 14px; }
.side h3 { margin: 0 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: .03em; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tools button { flex: 1 1 0; min-width: 58px; padding: 6px 4px; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tools .ic { font-size: 20px; line-height: 1; }
.cur { display: flex; align-items: center; gap: 10px; }
.sw-big { width: 44px; height: 44px; border-radius: 8px; border: 2px solid var(--text); }
.pal { display: grid; grid-template-columns: repeat(auto-fill, 34px); gap: 5px; }
.pal button { width: 34px; height: 34px; min-height: 34px; padding: 0; border-radius: 6px; border: 2px solid transparent; position: relative; }
.pal button.sel { border-color: var(--text); box-shadow: 0 0 0 2px var(--bg) inset; }
.pal.editing button.own::after { content: "×"; position: absolute; top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 99px; background: var(--bad); color: #fff; font-size: 13px; line-height: 18px; text-align: center; }
.addc { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.addc input[type=color] { width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; }
.addc input[type=text] { width: 96px; height: 44px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 14px var(--f-mono); }
.addc input.err { border-color: var(--bad); }
.prev { display: flex; gap: 10px; align-items: flex-end; }
.prev canvas { image-rendering: pixelated; background: #4a5a3f; border-radius: 4px; }
.vers { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.vers button { flex: none; width: 74px; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; min-height: 0; }
.vers button.sel { border-color: var(--accent); }
.vers img { width: 56px; height: 56px; object-fit: contain; image-rendering: pixelated; background: repeating-conic-gradient(var(--chk1) 0 25%, var(--chk2) 0 50%) 0 0 / 8px 8px; border-radius: 4px; }
.sw { display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }
.sw input { width: 22px; height: 22px; accent-color: var(--accent); }
.state { font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--panel2); }
.state.dirty { background: var(--accent); color: #1b1f26; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 12px 22px; border-radius: 10px; font-size: 18px; font-weight: 700; z-index: 30; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); }
.toast.ok { background: var(--ok); color: #0f1a12; }
.toast.bad { background: var(--bad); color: #fff; }
.toast button { min-height: 32px; padding: 2px 10px; background: rgba(0,0,0,.25); border: 0; }
.modal { position: fixed; inset: 0; background: rgba(10,12,16,.7); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; max-width: 420px; display: flex; flex-direction: column; gap: 14px; }
.modal .box p { margin: 0; }
@media (max-width: 900px) {
  .ed { grid-template-columns: 1fr; grid-template-rows: minmax(0, 58fr) minmax(0, 42fr); }
  .side { border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); align-content: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <div class="bar" id="bar"></div>
  <div id="main" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden><div class="box"><p id="mText"></p><div class="row" id="mBtns"></div></div></div>

<script>
'use strict';
const TRIBES = [['steel', 'เหล็กกล้า'], ['fire', 'เพลิงเผา'], ['storm', 'สายฟ้า'], ['wind', 'วายุ'], ['spirit', 'ภูติ'], ['demon', 'อสูร']];
const TRIBE_TH = Object.fromEntries(TRIBES);
const $ = (id) => document.getElementById(id);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else if (k === 'class') e.className = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const blobUrl = (id) => '/_blob/' + id;
const HEX_RE = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i;
const normHex = (s) => { const m = HEX_RE.exec(String(s).trim()); if (!m) return null; let x = m[1].toLowerCase(); if (x.length === 3) x = x.split('').map((c) => c + c).join(''); return '#' + x; };
const rgbHex = (r, g, b) => '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
const hexRgb = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));

// ---------- state ----------
const S = {
  pics: [], palettes: {}, ready: false, loadErr: '',
  edits: [], ownPal: {}, db: null, assets: null, dbState: 'wait',
  form: lsGet('pxForm', 1), tribe: '', view: 'list',
};
let E = null; // editor state

// ---------- toast + modal ----------
let toastT = 0;
function toast(msg, ok = true) {
  const t = $('toast'); clearTimeout(toastT);
  t.replaceChildren(h('span', null, msg));
  t.className = 'toast ' + (ok ? 'ok' : 'bad');
  if (!ok) t.append(h('button', { onclick: () => { t.hidden = true; } }, 'ปิด'));
  t.hidden = false;
  if (ok) toastT = setTimeout(() => { t.hidden = true; }, 1500);
}
function ask(text, buttons) {
  $('mText').textContent = text;
  $('mBtns').replaceChildren(...buttons.map(([label, fn, cls]) => h('button', { class: cls || '', onclick: () => { $('modal').hidden = true; fn && fn(); } }, label)));
  $('modal').hidden = false;
}

// ---------- data ----------
function editsFor(key) { return S.edits.filter((e) => e.key === key).sort((a, b) => (a.t < b.t ? 1 : -1)); }
function latestUrl(p) { const e = editsFor(p.key)[0]; return e ? blobUrl(e.asset) : blobUrl(p.asset); }
function ownColors(item) { return S.ownPal[item] || []; }

async function boot() {
  render();
  try {
    const r = await fetch('pics.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (!Array.isArray(j.pics)) throw new Error('bad list');
    S.pics = j.pics.filter((p) => p && typeof p.key === 'string' && /^[0-9a-f]{32}$/.test(p.asset || ''));
    for (const [k, v] of Object.entries(j.palettes || {})) if (Array.isArray(v)) S.palettes[k] = v.map(normHex).filter(Boolean);
    S.ready = true;
  } catch (e) { S.loadErr = 'ยังไม่มีรายการรูป (' + e.message + ')'; }
  render();
  connect();
}
async function connect() {
  const timer = setTimeout(() => { if (S.dbState === 'wait') { S.dbState = 'slow'; render(); } }, 10000);
  const c = window.claude;
  const [db, assets] = await Promise.all([c?.use ? c.use('db') : null, c?.use ? c.use('assets') : null]);
  S.db = db; S.assets = assets;
  if (!db) { clearTimeout(timer); S.dbState = 'none'; render(); return; }
  db.collection('edits').onSnapshot((snap) => {
    clearTimeout(timer);
    S.edits = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((e) => typeof e.key === 'string' && /^[0-9a-f]{32}$/.test(e.asset || '') && typeof e.t === 'string');
    S.dbState = 'ok'; render();
  }, (err) => { clearTimeout(timer); S.dbState = 'err:' + (err?.code || 'error'); render(); });
  db.collection('palettes').onSnapshot((snap) => {
    S.ownPal = {};
    for (const d of snap.docs) { const v = d.data()?.colors; if (Array.isArray(v)) S.ownPal[d.id] = v.map(normHex).filter(Boolean).slice(0, 64); }
    if (E) renderSide();
  }, () => {});
}

// ---------- list view ----------
function render() {
  if (S.view === 'edit' && E) return; // editor manages itself
  const bar = $('bar'), main = $('main');
  const edited = new Set(S.edits.map((e) => e.key));
  bar.replaceChildren(
    h('h1', null, 'แก้พิกเซลภาพนิ่ง'),
    h('span', { class: 'dim' }, `แก้แล้ว ${S.pics.filter((p) => edited.has(p.key)).length}/${S.pics.length}`),
    h('span', { class: 'sp' }),
    h('div', { class: 'seg', role: 'group', 'aria-label': 'ร่าง' },
      [1, 3].map((f) => h('button', { class: S.form === f ? 'on' : '', onclick: () => { S.form = f; lsSet('pxForm', f); render(); } }, 'ร่าง ' + f))),
  );
  const kids = [];
  if (S.dbState === 'none') kids.push(h('div', { class: 'note bad' }, 'บันทึกงานไม่ได้ในหน้านี้: ต้องเปิดบน claude.ai ด้วยบัญชีเจ้าของ (ดูรูปได้อย่างเดียว)'));
  else if (S.dbState === 'slow') kids.push(h('div', { class: 'note' }, 'กำลังโหลดงานที่บันทึกไว้… ถ้านานเกินไป ลองเปิดหน้าใหม่'));
  else if (S.dbState.startsWith('err')) kids.push(h('div', { class: 'note bad' }, 'โหลดงานที่บันทึกไว้ไม่ได้ (' + S.dbState.slice(4) + ') ลองเปิดหน้าใหม่'));
  if (S.loadErr) kids.push(h('div', { class: 'note bad' }, S.loadErr));
  else if (!S.ready) kids.push(h('div', { class: 'note' }, 'กำลังโหลดรายการรูป…'));
  else {
    kids.push(h('div', { class: 'note dim' }, 'แตะรูปเพื่อแก้ · ทุกครั้งที่กดบันทึก รูปเดิมยังเก็บไว้ · วันจันทร์ Claude ดึงงานล่าสุดของแต่ละรูปเข้า Hub (รอบใหม่ + ★)'));
    kids.push(h('div', { class: 'chips' },
      h('button', { class: S.tribe === '' ? 'on' : '', style: '--c: var(--dim)', onclick: () => { S.tribe = ''; render(); } }, 'ทุกเผ่า'),
      TRIBES.map(([t, th]) => h('button', { class: S.tribe === t ? 'on' : '', style: `--c: var(--${t})`, onclick: () => { S.tribe = S.tribe === t ? '' : t; render(); } }, th))));
    for (const [t, th] of TRIBES) {
      if (S.tribe && S.tribe !== t) continue;
      const ps = S.pics.filter((p) => p.tribe === t && p.form === S.form);
      if (!ps.length) continue;
      kids.push(h('div', { class: 'tribe', style: `--c: var(--${t})` }, th));
      kids.push(h('div', { class: 'grid' }, ps.map((p) => {
        const n = editsFor(p.key).length;
        return h('button', { class: 'tile', style: `--c: var(--${t})`, onclick: () => openEditor(p), 'aria-label': `${p.item} ${p.name} ร่าง ${p.form}` },
          h('div', { class: 'pic' }, h('img', { src: latestUrl(p), alt: '', loading: 'lazy', style: p.flip ? 'transform: scaleX(-1)' : null })),
          h('div', { class: 'nm' }, h('b', { class: 'mono' }, p.item), ' ', p.name),
          n ? h('span', { class: 'badge' }, 'แก้ ' + n) : null);
      })));
    }
  }
  main.replaceChildren(h('div', { class: 'list' }, kids));
}

// ---------- editor ----------
function loadImage(url) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('โหลดรูปไม่ได้')); i.src = url; });
}
async function readPixels(url) {
  const img = await loadImage(url);
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  return { w: c.width, h: c.height, data: x.getImageData(0, 0, c.width, c.height).data };
}
async function openEditor(p, verAsset) {
  const vers = editsFor(p.key);
  const asset = verAsset || (vers[0] ? vers[0].asset : p.asset);
  let px;
  try { px = await readPixels(blobUrl(asset)); } catch (e) { toast(e.message, false); return; }
  const prev = E;
  E = {
    p, asset, w: px.w, h: px.h, data: new Uint8ClampedArray(px.data), base: new Uint8ClampedArray(px.data),
    undo: [], redo: [], dirty: false, tool: prev?.tool === 'pick' ? 'pen' : (prev?.tool || 'pen'), color: prev?.color || '#000000',
    z: 8, ox: 0, oy: 0, grid: lsGet('pxGrid', true), penOnly: lsGet('pxPen', false), compare: false, palEdit: false,
    ptrs: new Map(), stroke: null, pinch: null, fitted: false,
  };
  S.view = 'edit';
  buildEditor();
}
function leaveEditor() {
  const go = () => { E = null; S.view = 'list'; render(); };
  if (E && E.dirty) ask('ยังไม่ได้บันทึกรูปนี้ ออกเลยไหม? (สิ่งที่แก้จะหาย)', [['ออกโดยไม่บันทึก', go], ['กลับไปแก้ต่อ', null, 'primary']]);
  else go();
}
function buildEditor() {
  const p = E.p;
  $('bar').replaceChildren(...[
    h('button', { onclick: leaveEditor }, '◀ รายการ'),
    h('h1', null, h('span', { class: 'mono' }, p.item), ' ', p.name, h('span', { class: 'dim' }, ' · ร่าง ' + p.form)),
    p.flip ? h('span', { class: 'dim', title: 'Hub ตั้ง ⇋ กลับข้างไว้ ไฟล์จริงไม่กลับ' }, '⇋ แสดงกลับข้างตาม Hub') : null,
    h('span', { class: 'sp' }),
    h('span', { id: 'st', class: 'state' }),
    h('button', { id: 'saveBtn', class: 'primary', onclick: save }, 'บันทึก'),
  ].filter(Boolean));
  const stage = h('div', { class: 'stage', id: 'stage' }, h('canvas', { id: 'cv' }));
  $('main').replaceChildren(h('div', { class: 'ed' }, stage, h('div', { class: 'side', id: 'side' })));
  E.pix = document.createElement('canvas'); E.pix.width = E.w; E.pix.height = E.h;
  E.basePix = document.createElement('canvas'); E.basePix.width = E.w; E.basePix.height = E.h;
  E.basePix.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(E.base), E.w, E.h), 0, 0);
  bindStage(stage);
  new ResizeObserver(() => { if (!E) return; if (!E.fitted) fit(); draw(); }).observe(stage);
  renderSide(); syncPix(); updateState();
}
function updateState() {
  const st = $('st'); if (!st) return;
  st.textContent = E.dirty ? 'ยังไม่บันทึก' : 'ไม่มีงานค้าง';
  st.className = 'state' + (E.dirty ? ' dirty' : '');
  $('saveBtn').disabled = !E.dirty || !S.assets || !S.db;
  if ($('undoB')) $('undoB').disabled = !E.undo.length;
  if ($('redoB')) $('redoB').disabled = !E.redo.length;
}
function syncPix() {
  E.pix.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(E.data), E.w, E.h), 0, 0);
  draw(); drawPrev();
}
function fit() {
  const st = $('stage'); if (!st) return;
  const W = st.clientWidth, H = st.clientHeight; if (!W || !H) return;
  E.z = Math.max(1, Math.floor(Math.min((W - 32) / E.w, (H - 32) / E.h)));
  E.ox = Math.round((W - E.w * E.z) / 2); E.oy = Math.round((H - E.h * E.z) / 2); E.fitted = true;
}
function zoomAt(nz, cx, cy) {
  nz = Math.min(64, Math.max(1, nz));
  const wx = (cx - E.ox) / E.z, wy = (cy - E.oy) / E.z;
  E.z = nz; E.ox = cx - wx * nz; E.oy = cy - wy * nz; draw();
}
function draw() {
  const cv = $('cv'); if (!cv || !E) return;
  const st = $('stage'), dpr = window.devicePixelRatio || 1;
  const W = st.clientWidth, H = st.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const x = cv.getContext('2d');
  x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
  const cs = getComputedStyle(document.documentElement);
  const w = E.w * E.z, hh = E.h * E.z;
  // checker under the picture, one square per 2 pixels
  const q = Math.max(4, E.z * 2);
