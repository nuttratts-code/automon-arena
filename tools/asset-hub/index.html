<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'">
<title>คลังงานศิลป์ Automon</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>คลังงานศิลป์ <span>Automon</span></h1>
  <nav class="tabs" id="tabs">
    <button data-tab="chars" class="on">ตัวละคร</button>
    <button data-tab="other">ฉาก · 3D · เอฟเฟกต์ · UI</button>
    <button data-tab="library">คลังเดิม</button>
    <button data-tab="queue">งานถึง Claude <b id="qCount"></b></button>
  </nav>
  <button id="exportBtn" class="ghost" title="เขียน godot/data/unit_shadows.json จากค่าเงาทุกตัว">ส่งค่าเงาเข้า Godot</button>
</header>
<div class="shell">
  <aside class="rail" id="rail">
    <input id="search" type="search" placeholder="ค้นหา ID หรือชื่อ" aria-label="ค้นหา">
    <div class="chips" id="tribeChips"></div>
    <select id="statusFilter" aria-label="กรองตามสถานะ"></select>
    <button id="boardBtn" class="ghost wide">ภาพรวมทุกตัว</button>
    <div id="list" class="list"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
