name: tests

# Same merge gate CLAUDE.md requires: build the 3 pages + run all tests + ui_smoke on the BUILT pages.
# (Set 62 lesson: source tests passed while the built balance page was broken.)
# Runs on every push to every branch (+ manual): the repo is public, so Actions minutes are free (decision 6 Nov, set 104).
# The in-chat gate before merge (CLAUDE.md rule 3) still applies.
# Set 139 (8 Nov): docs-only pushes (claude/, art/, *.md) skip this run — nothing in them is built into the pages.
on:
  push:
    paths-ignore:
      - 'claude/**'
      - 'art/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright + chromium
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Gate (build + tests + ui_smoke)
        working-directory: src
        run: node tools/bootstrap.mjs gate
      # Set 178: on failure keep the full ui_smoke output + screenshots (the log tail cut off the failing step in sets 149/175b)
      - name: Upload ui_smoke output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-shots
          path: /tmp/automon-shots
          retention-days: 7
          if-no-files-found: ignore
