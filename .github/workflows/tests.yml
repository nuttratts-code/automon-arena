name: tests

# Same merge gate CLAUDE.md requires: build the 3 pages + run all tests + ui_smoke on the BUILT pages.
# (Set 62 lesson: source tests passed while the built balance page was broken.)
# Runs on push to main only (+ manual): set 190 S-A1 made the repo private (HARD RULE 9) → limited free Actions minutes.
# Branch work is checked by the in-chat gate before merge; this run guards what lands on main.
# The in-chat gate before merge (CLAUDE.md rule 3) still applies.
# Set 139 (8 Nov): docs-only pushes (claude/, art/, *.md) skip this run — nothing in them is built into the pages.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'claude/**'
      - 'art/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/pw-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # set 180: same major as the cloud chats (was 20 → "passes in chat, fails in CI" risk)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install playwright + chromium
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium
      - name: Gate (build + tests + ui_smoke)
        working-directory: src
        run: node tools/bootstrap.mjs gate
      # Set 178: on failure keep the full ui_smoke output + screenshots (the log tail cut off the failing step in sets 149/175b)
      - name: Upload ui_smoke output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-shots
          path: /tmp/automon-shots
          retention-days: 7
          if-no-files-found: ignore

  # Set 192 (Godot plan P1 step 3): headless Godot tests. Golden fixtures are rebuilt first
  # (set 191 B1: never committed). Godot only from the official GitHub release, version +
  # SHA-512 pinned in godot/tools/get_godot.sh (HARD RULE 9 ②). No export templates here.
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Golden fixtures (JS reference)
        working-directory: src
        run: node lab/golden.mjs
      - name: Get Godot (pinned + checksum)
        run: echo "GODOT=$(godot/tools/get_godot.sh "$RUNNER_TEMP/godot")" >> "$GITHUB_ENV"
      - name: Godot tests (headless)
        # grep + timeout too: never trust the exit code alone (set 192: a broken test file once hung the runner)
        run: |
          timeout 1200 "$GODOT" --headless --path godot -s res://tests/run.gd -- --require-golden 2>&1 | tee godot-tests.log
          grep -q "^GODOT TESTS: PASS" godot-tests.log
      - name: Godot-made ARUN1 code reads in the JS Balance Room reader (set 195 step 6f)
        working-directory: src
        run: node lab/golden-save.mjs check ../godot/tests/golden/godot-arun1.txt
